name: Refresh data

# Quarterly refresh of the generated datasets and insights, followed by a
# redeploy. Runs after typical filing windows; adjust the cron as needed.
# Requires the same GCP/Firebase secrets as Deploy plus:
#   SEC_USER_AGENT  - contact string for SEC EDGAR requests
#   OPENAI_API_KEY  - key for insight summarization and embeddings
#   QUOTES_API_URL  - public URL of the deployed quotes-api (for web + Streamlit)
on:
  workflow_dispatch:
    inputs:
      airlines:
        description: "Space-separated airlines, e.g. AAL DAL UAL (defaults to AAL DAL UAL LUV ALK JBLU ULCC ALGT RJET SKYW)"
        required: false
      years:
        description: "Space-separated years, e.g. 2026 (defaults to latest completed period year)"
        required: false
      periods:
        description: "Space-separated periods, e.g. Q2 (defaults to latest completed period)"
        required: false
      sources:
        description: "Financial metric sources"
        type: choice
        options: [both, auto, manual]
        default: both
      overwrite:
        description: "Replace supplied financial metrics in the selected slice (never erase with nulls)"
        type: boolean
        default: false
      use_filing_parser:
        description: "Enrich auto metrics with filing-level XBRL (skipped for manual-only)"
        type: boolean
        default: true
      share_data:
        description: "Rebuild the full, unscoped share repurchase/sale history"
        type: boolean
        default: false
      generate_insights:
        description: "Generate SEC/LLM insights before publishing"
        type: boolean
        default: true
  schedule:
    # 06:00 UTC on the 15th day of Feb, May, Aug, Nov
    - cron: "0 6 15 2,5,8,11 *"

permissions:
  contents: write
  id-token: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: airline-dashboard/core
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMBEDDING_BACKEND: openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Determine run parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AIRLINES: ${{ inputs.airlines }}
          INPUT_YEARS: ${{ inputs.years }}
          INPUT_PERIODS: ${{ inputs.periods }}
          INPUT_SOURCES: ${{ inputs.sources }}
          INPUT_OVERWRITE: ${{ inputs.overwrite }}
          INPUT_FILING_PARSER: ${{ inputs.use_filing_parser }}
          INPUT_SHARE_DATA: ${{ inputs.share_data }}
          INPUT_INSIGHTS: ${{ inputs.generate_insights }}
        run: |
          month="$(date -u +%m)"
          year="$(date -u +%Y)"

          case "$month" in
            01|02|03)
              default_year="$((year - 1))"
              default_period="Q4 FY"
              ;;
            04|05|06)
              default_year="$year"
              default_period="Q1"
              ;;
            07|08|09)
              default_year="$year"
              default_period="Q2"
              ;;
            10|11|12)
              default_year="$year"
              default_period="Q3"
              ;;
          esac

          if [ "$EVENT_NAME" = "schedule" ]; then
            airlines="AAL DAL UAL LUV ALK JBLU ULCC ALGT RJET SKYW"
            years="$default_year"
            periods="$default_period"
            sources="both"
            overwrite="false"
            filing_parser="true"
            share_data="false"
            insights="true"
          else
            airlines="$INPUT_AIRLINES"
            years="$INPUT_YEARS"
            periods="$INPUT_PERIODS"
            sources="${INPUT_SOURCES:-both}"
            overwrite="${INPUT_OVERWRITE:-false}"
            filing_parser="${INPUT_FILING_PARSER:-true}"
            share_data="${INPUT_SHARE_DATA:-false}"
            insights="${INPUT_INSIGHTS:-true}"

            if [ -z "$airlines" ]; then
              airlines="AAL DAL UAL LUV ALK JBLU ULCC ALGT RJET SKYW"
            fi
            if [ -z "$years" ]; then
              years="$default_year"
            fi
            if [ -z "$periods" ]; then
              periods="$default_period"
            fi
          fi

          for value in "$airlines" "$years" "$periods"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::Selections must be single-line, space-separated lists"
              exit 1
            fi
          done
          read -r -a airline_args <<< "$airlines"
          read -r -a year_args <<< "$years"
          read -r -a period_args <<< "$periods"
          if (( ${#airline_args[@]} == 0 || ${#year_args[@]} == 0 || ${#period_args[@]} == 0 )); then
            echo "::error::Selections must not be empty"
            exit 1
          fi
          for airline in "${airline_args[@]}"; do
            [[ "$airline" =~ ^[A-Z][A-Z0-9]*$ ]] || { echo "::error::Invalid airline: $airline"; exit 1; }
          done
          for year in "${year_args[@]}"; do
            [[ "$year" =~ ^[0-9]{4}$ ]] || { echo "::error::Invalid year: $year"; exit 1; }
          done
          for period in "${period_args[@]}"; do
            [[ "$period" =~ ^(Q[1-4]|FY)$ ]] || { echo "::error::Invalid period: $period"; exit 1; }
          done
          case "$sources" in
            both) sources="auto manual" ;;
            auto) ;;
            manual) filing_parser="false" ;;
            *) echo "::error::Invalid financial sources"; exit 1 ;;
          esac
          for flag in "$overwrite" "$filing_parser" "$share_data" "$insights"; do
            [[ "$flag" == "true" || "$flag" == "false" ]] || { echo "::error::Invalid boolean input"; exit 1; }
          done

          echo "airlines=${airline_args[*]}" >> "$GITHUB_OUTPUT"
          echo "years=${year_args[*]}" >> "$GITHUB_OUTPUT"
          echo "periods=${period_args[*]}" >> "$GITHUB_OUTPUT"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "overwrite=$overwrite" >> "$GITHUB_OUTPUT"
          echo "filing_parser=$filing_parser" >> "$GITHUB_OUTPUT"
          echo "share_data=$share_data" >> "$GITHUB_OUTPUT"
          echo "insights=$insights" >> "$GITHUB_OUTPUT"

          echo "Using airlines: $airlines"
          echo "Using years: $years"
          echo "Using periods: $periods"
      - name: Build financials and optional buybacks
        env:
          AIRLINES: ${{ steps.params.outputs.airlines }}
          YEARS: ${{ steps.params.outputs.years }}
          PERIODS: ${{ steps.params.outputs.periods }}
          SOURCES: ${{ steps.params.outputs.sources }}
          OVERWRITE: ${{ steps.params.outputs.overwrite }}
          FILING_PARSER: ${{ steps.params.outputs.filing_parser }}
          SHARE_DATA: ${{ steps.params.outputs.share_data }}
        run: |
          read -r -a airlines <<< "$AIRLINES"
          read -r -a years <<< "$YEARS"
          read -r -a periods <<< "$PERIODS"
          read -r -a sources <<< "$SOURCES"
          flags=()
          if [ "$OVERWRITE" = "true" ]; then flags+=(--overwrite); fi
          if [ "$FILING_PARSER" = "true" ]; then flags+=(--use-filing-parser); fi
          if [ "$SHARE_DATA" = "true" ]; then flags+=(--share-data); fi
          python -m scripts.build_data --airlines "${airlines[@]}" --years "${years[@]}" --periods "${periods[@]}" --sources "${sources[@]}" "${flags[@]}"
      - name: Generate insights
        if: steps.params.outputs.insights == 'true'
        env:
          AIRLINES: ${{ steps.params.outputs.airlines }}
          YEARS: ${{ steps.params.outputs.years }}
          PERIODS: ${{ steps.params.outputs.periods }}
        run: |
          read -r -a airlines <<< "$AIRLINES"
          read -r -a years <<< "$YEARS"
          read -r -a periods <<< "$PERIODS"
          python -m sec_pipeline.pipeline --airlines "${airlines[@]}" --years "${years[@]}" --periods "${periods[@]}"
      - name: Commit refreshed generated data
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ../data/generated/*.json

          if git diff --cached --quiet; then
            echo "No generated data changes to commit"
          else
            git commit -m "chore(data): refresh generated datasets [skip ci]"
            git push origin "$BRANCH_NAME"
          fi
      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: airline-dashboard/data/generated/*.json

  redeploy:
    needs: build-data
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: generated-data
          path: airline-dashboard/data/generated
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDP }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Rebuild and deploy Streamlit
        run: |
          gcloud builds submit airline-dashboard \
            --config airline-dashboard/deploy/cloudbuild.streamlit.yaml \
            --substitutions=SHORT_SHA="${{ github.sha }}",_QUOTES_API_URL="${{ secrets.QUOTES_API_URL }}",_GA_MEASUREMENT_ID="${{ vars.GA_MEASUREMENT_ID }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
      - name: Detect web lockfile
        id: webfiles
        run: |
          if [ -f "airline-dashboard/web/package-lock.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Skipping web deploy: airline-dashboard/web/package-lock.json not found"
          fi
      - uses: actions/setup-node@v4
        if: steps.webfiles.outputs.found == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: airline-dashboard/web/package-lock.json
      - name: Build static site
        if: steps.webfiles.outputs.found == 'true'
        working-directory: airline-dashboard/web
        env:
          NEXT_PUBLIC_QUOTES_API_URL: ${{ secrets.QUOTES_API_URL }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Firebase Hosting
        if: steps.webfiles.outputs.found == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live
          entryPoint: airline-dashboard
